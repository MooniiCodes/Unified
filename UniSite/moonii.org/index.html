<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0; /* Removes default browser margins */
        }
        iframe {
            position: fixed; /* Fixes position relative to viewport */
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <iframe src="https://moonii.org/" allowfullscreen></iframe>
</body>
</html>
