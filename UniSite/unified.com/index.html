<!DOCTYPE Html>
<html>
  <head>
    <title>Unified</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <link rel="icon" type="image/png" href="https://MooniiCodes.github.io/Unified/favicon.png">
    <script>
      function search() {
        const inputElement = document.getElementById('search');

        // Access the value property
        const inputValue = inputElement.value;

        // Use the value (e.g., log it to the console or display it)
        console.log('Domain input:', inputValue);
        window.location.href = "https://MooniiCodes.github.io/Unified/UniSite/" + inputValue + "/";
      }
    </script>
    <style>
      body {
        text-align: center;
      }
      h1 {
        font-size: x-large;
      }
    </style>
  </head>
  <body>
    <h1>Unified</h1>
    <label></label>
    <input type="text" id="search">
    <button onclick="search()">Search</button>
  </body>
</html>
